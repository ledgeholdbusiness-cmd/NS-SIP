<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledgehold Enterprise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .page-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Space image layer */
        .space-layer {
            position: absolute;
            inset: 0;
            background-image: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?w=1920&q=80');
            background-size: cover;
            background-position: center;
            opacity: 0.35;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 70%);
        }

        /* Content */
        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 24px;
            max-width: 640px;
        }

        .content h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .content h1 strong {
            font-weight: 600;
            color: #ffffff;
        }

        .content .divider {
            width: 60px;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
            margin: 28px auto;
        }

        .content p {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
            line-height: 1.8;
            max-width: 480px;
            margin: 0 auto;
        }

        .content .footer-note {
            margin-top: 48px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* Stars */
        .stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Space image -->
        <div class="space-layer"></div>

        <!-- Subtle scattered stars -->
        <div class="stars">
            <div class="star" style="width: 1px; height: 1px; top: 15%; left: 20%; animation-delay: 0s;"></div>
            <div class="star" style="width: 1.5px; height: 1.5px; top: 25%; left: 75%; animation-delay: 0.8s;"></div>
            <div class="star" style="width: 1px; height: 1px; top: 60%; left: 12%; animation-delay: 1.6s;"></div>
            <div class="star" style="width: 1px; height: 1px; top: 70%; left: 85%; animation-delay: 2.4s;"></div>
            <div class="star" style="width: 2px; height: 2px; top: 40%; left: 50%; animation-delay: 0.4s;"></div>
            <div class="star" style="width: 1px; height: 1px; top: 80%; left: 35%; animation-delay: 1.2s;"></div>
            <div class="star" style="width: 1.5px; height: 1.5px; top: 10%; left: 55%; animation-delay: 2s;"></div>
            <div class="star" style="width: 1px; height: 1px; top: 50%; left: 8%; animation-delay: 3s;"></div>
            <div class="star" style="width: 1px; height: 1px; top: 35%; left: 90%; animation-delay: 1s;"></div>
            <div class="star" style="width: 1.5px; height: 1.5px; top: 90%; left: 65%; animation-delay: 2.8s;"></div>
        </div>

        <!-- Text content -->
        <div class="content">
            <h1>
                This domain is owned by<br>
                <strong>Ledgehold Enterprise</strong>
            </h1>

            <div class="divider"></div>

            <p>
                Our platform is currently in development and will be available soon.
                For enquiries, please contact us at help@ledgehold.xyz.
            </p>

            <p class="footer-note">Ghana &middot; Established 2025</p>
        </div>
    </div>
</body>
</html>
